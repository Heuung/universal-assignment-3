<!DOCTYPE html>
<html>
    <head>
        <title>3주차 과제</title>
    </head>
    <body>
        <!--9번 문제-->
        <fieldset>

            <legend>9번문제</legend>

            <table>
                <tr>
                    <td>
                       <b>아이디</b>
                    </td>
                    <td>
                        <input type = "text" name = "id">
                    </td>
                </tr>

                <tr>
                    <td>
                        <b>비밀번호</b>
                    </td>
                    <td>
                        <input type = "password" name = "password"><br>
                    </td>
                </tr>
            </table>
            <input type = "submit">
        </fieldset>

        <!--10번 문제-->
        <fieldset>

            <legend>10번문제</legend>

            <table>
                <tr>
                    <td>
                        <label for = "name"><b>시작 그룹</b></label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input id = "newpage" type = "radio" name = "group">
                        <label for = "newpage">새 탭 페이지 열기</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input id = "continue" type = "radio" name = "group">
                        <label for = "continue">중단한 위치에서 계속하기</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input id = "snewpage" type = "radio" name = "group">
                        <label for = "snewpage">특정 페이지 또는 페이지 모음 열기</label>
                    </td>
                </tr>
            </table>

            <br>

            <table>
                <tr>
                    <td>
                        <b>개인정보 및 보안</b>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input id = "service" type = "checkbox" name = "privacy">
                        <label for = "service">동기화 및 서비스</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input id = "login" type = "checkbox" name = "privacy">
                        <label for = "login">로그인 허용</label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input id = "pageload" type = "checkbox" name = "privacy">
                        <label for = "pageload">페이지 미리 로드</label>
                    </td>
                </tr>
            </table>
        </fieldset>

        <!--11번-->
        <fieldset>

            <legend>11번문제</legend>
            <h1>글 작성하기</h1>

            <table>
                <tr>
                    <td>
                        <b>작성자</b>
                    </td>
                    <td>
                        <input id="writer" type="text" name="no.11">
                    </td>
                </tr>

                <tr>
                    <td>
                        <b>아이디</b>
                    </td>
                    <td>
                        <input id="id" type="text" name="no.11">
                    </td>
                </tr>

                <tr>
                    <td>
                        <b>이메일</b>
                    </td>
                    <td>
                        <input id="emailid" type="text" name="no.11">
                        <label>@</label>
                        <input id="emailadress" type="text" name="no.11">
                    </td>
                </tr>

                <tr>
                    <td>
                        <b>휴대폰</b>
                    </td>
                    <td>
                        <select>
                            <option>010</option>
                            <option>011</option>
                        </select>

                        <label>-</label>

                        <input id="secnum" type="text" name="no.11">
                        <label>-</label>
                        <input id="trdnum" type="text" name="no.11">
                    </td>
                </tr>

                <tr>
                    <td>
                        <b>글제목</b>
                    </td>
                    <td>
                        <input id="title" type="text" name="no.11">
                    </td>
                </tr>

                <tr>
                    <td style="vertical-align: middle;">
                        <b>내용</b>
                    </td>
                    <td>
                        <textarea cols="30" rows="10"></textarea>
                    </td>
                </tr>
            </table>
            <input type="submit">
        </fieldset>
    </body>
</html>
